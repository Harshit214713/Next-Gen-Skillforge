name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first — the solution follows from it.
        Want to build it yourself? Open a PR linking to this issue!

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem does this feature solve? Who benefits?
      placeholder: "As a user, I can't ... because ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you would like to happen, concretely.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why they fall short.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Frontend (UI/pages)
        - API / Worker
        - AI analysis quality
        - Developer experience / CI
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, screenshots, or links that help explain the request.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and discussions for duplicates
          required: true
        - label: I am willing to help implement this if accepted
